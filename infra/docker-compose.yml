version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tasklink-postgis
    environment:
      POSTGRES_USER: tasklink_user
      POSTGRES_PASSWORD: tasklink_password_2026
      POSTGRES_DB: tasklink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../db/seeds/001_demo_seed.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklink_user -d tasklink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  matching-service:
    build:
      context: ../services/matching
      dockerfile: Dockerfile
    container_name: tasklink-matching
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://tasklink_user:tasklink_password_2026@postgres:5432/tasklink_db
    depends_on:
      postgres:
        condition: service_healthy

  api-service:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: tasklink-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://tasklink_user:tasklink_password_2026@postgres:5432/tasklink_db
      - MATCHING_SERVICE_URL=http://matching-service:8000
      - JWT_SECRET=tasklink_sih2026_super_secret_jwt_key
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-sandbox_user}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-sandbox_key}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_secret}
    depends_on:
      postgres:
        condition: service_healthy
      matching-service:
        condition: service_started

  admin-dashboard:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    container_name: tasklink-admin
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - api-service

volumes:
  postgres_data:
